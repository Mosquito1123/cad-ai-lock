[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-ai-lock"
version = "0.4.3"
description = "CAD→glTF→3D controls→AI style pipeline with repair loops"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CAD AI Lock" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
  "pypdfium2>=4.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "trimesh>=4.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
replicate = ["replicate>=0.25"]
fal = ["fal-client>=0.4"]
local = ["diffusers>=0.27", "torch>=2.0", "transformers>=4.38", "accelerate>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
cad-ai-lock = "cad_ai_lock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_ai_lock = ["py.typed", "policies/*.yaml"]
